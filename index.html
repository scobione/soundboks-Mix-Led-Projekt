<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#07080a"><title>SoundMix Glow V4.2</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="style.css"></head><body><div class="app">
<header><div class="brand"><span class="logo"></span><div><small>SOUNDMIX</small><h1>GLOW <b>V4</b></h1></div></div><button id="deviceBtn" class="device"><i></i> TEST DEVICE⌄</button></header>
<main>
<section id="home" class="screen active"><div class="hero"><div class="head"><div><small>NOW PLAYING</small><h2 id="effectTitle">Cyan Pulse</h2></div><em>● TEST</em></div><div class="visual"><div id="orb"></div><div id="ring"></div><div id="bars"></div></div><div class="heroBtns"><button id="power">⏻</button><div><span id="colorDot"></span><small>COLOR</small><strong id="colorName">00EAFF</strong></div><button id="shuffle">⤨</button></div></div><div class="quick"><button data-go="lights">✦<small>LIGHTS</small><b>Effects</b></button><button data-go="music">◒<small>MUSIC</small><b>Visualizer</b></button><button data-go="colors">◉<small>COLOR</small><b>Palette</b></button><button data-go="presets">▣<small>PRESETS</small><b>16 scenes</b></button></div></section>
<section id="lights" class="screen"><div class="top"><div><small>LIGHT ENGINE</small><h2>Effects</h2></div><button id="random">⤨</button></div><div id="effects" class="grid"></div><div class="controls"><label>Brightness <output id="bo">80%</output><input id="brightness" type="range" value="80"></label><label>Speed <output id="so">50%</output><input id="speed" type="range" value="50"></label><label>Intensity <output id="io">75%</output><input id="intensity" type="range" value="75"></label></div></section>
<section id="colors" class="screen"><div class="top"><div><small>COLOR ENGINE</small><h2>Color Lab</h2></div><button id="rainbow">RAINBOW</button></div><div class="picker"><input id="color" type="color" value="#00EAFF"><div id="big"></div></div><div id="palette" class="palette"></div><div class="hex"><input id="hex" value="#00EAFF"><button id="apply">APPLY</button></div></section>
<section id="music" class="screen"><div class="top"><div><small>AUDIO ENGINE</small><h2>Music Sync</h2></div><span class="green">SIMULATED</span></div><div class="audio"><div id="vu"></div><div class="audioLabel"><b id="modeName">BEAT</b><small>LIVE ANALYSIS</small></div></div><div class="modes"><button class="active" data-mode="beat">BEAT 🥁</button><button data-mode="vu">VU METER ▮</button><button data-mode="spectrum">SPECTRUM ▥</button><button data-mode="bass">BASS PULSE ◉</button></div><div class="controls"><label>Sensitivity <output id="sensO">70%</output><input id="sens" type="range" value="70"></label><label>Response <output id="respO">55%</output><input id="resp" type="range" value="55"></label></div></section>
<section id="presets" class="screen"><div class="top"><div><small>SCENES</small><h2>Presets</h2></div><button id="save">＋ SAVE</button></div><div id="presetGrid" class="presets"></div></section>
</main><nav><button class="active" data-screen="home">⌂<small>HOME</small></button><button data-screen="lights">✦<small>LIGHTS</small></button><button data-screen="colors">◉<small>COLOR</small></button><button data-screen="music">◒<small>MUSIC</small></button><button data-screen="presets">▣<small>PRESETS</small></button></nav></div><script>
window.addEventListener('error', e => {
  console.error(e.error || e.message);
});
</script><script type="module" src="src/app.js?v=42"></script></body></html>
