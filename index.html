<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SoundMix Glow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div>
        <div class="eyebrow">DIY LIGHT CONTROLLER</div>
        <h1>SoundMix <span>Glow</span></h1>
      </div>
      <div id="status" class="status offline">● Getrennt</div>
    </header>

    <section class="hero">
      <div class="device">
        <div class="speaker"></div>
        <div id="leds" class="leds"></div>
      </div>
      <div class="device-info">
        <div class="label">GERÄT</div>
        <strong id="deviceName">Kein Gerät verbunden</strong>
        <button id="connectBtn" class="primary">Bluetooth verbinden</button>
        <button id="testBtn" class="secondary">Testmodus: AUS</button>
        <p id="hint">Im Testmodus wird „SoundMix Glow TEST“ als simuliertes Gerät verwendet.</p>
      </div>
    </section>

    <section class="grid">
      <div class="card">
        <div class="card-title">Effekte</div>
        <div id="effects" class="effects"></div>
      </div>

      <div class="card">
        <div class="card-title">Farbe</div>
        <input id="color" type="color" value="#00d9ff">
        <div class="color-row">
          <button class="swatch" data-color="#00d9ff"></button>
          <button class="swatch" data-color="#ff00a8"></button>
          <button class="swatch" data-color="#7cff00"></button>
          <button class="swatch" data-color="#ffffff"></button>
          <button class="swatch" data-color="#ff7a00"></button>
        </div>
      </div>

      <div class="card sliders">
        <label>Helligkeit <output id="brightnessOut">80%</output>
          <input id="brightness" type="range" min="0" max="100" value="80">
        </label>
        <label>Geschwindigkeit <output id="speedOut">50%</output>
          <input id="speed" type="range" min="0" max="100" value="50">
        </label>
        <label>Musik-Reaktion <output id="musicOut">70%</output>
          <input id="music" type="range" min="0" max="100" value="70">
        </label>
      </div>

      <div class="card">
        <div class="card-title">Presets</div>
        <div id="presets" class="presets"></div>
      </div>
    </section>
  </main>
  <script type="module" src="src/app.js"></script>
</body>
</html>
